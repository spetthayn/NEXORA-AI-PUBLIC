# Optional local stack for Phase 0 SQL migration verification.
# Not required for unit tests. Use when validating schema on real PostgreSQL/TimescaleDB.
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_phase0
      POSTGRES_DB: nexora
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 10
